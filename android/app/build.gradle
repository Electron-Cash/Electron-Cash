apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.chaquo.python'

def REPO_ROOT = "../.."
def GENERATED_DIR = "$buildDir/generated/ec"
mkdir(GENERATED_DIR)
def STRINGS_DIR = "$GENERATED_DIR/strings"
def REQUIREMENTS_TXT = "$GENERATED_DIR/requirements.txt"
def REQUIREMENTS_ANDROID_TXT = "$GENERATED_DIR/requirements-android.txt"

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def BUILD_PYTHON = localProps.getProperty('build.python')

android {
    namespace 'org.electroncash.electroncash3'

    compileOptions {
        // Required by ACRA.
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    compileSdkVersion 36

    defaultConfig {
        applicationId "org.electroncash.wallet"
        minSdkVersion 24
        targetSdkVersion 36

        def ecVersion = null
        file("$REPO_ROOT/electroncash/version.py").eachLine {
            def matcher = it =~ / *PACKAGE_VERSION *= *'([0-9.]+)'.*/
            if (matcher.matches()) {
                ecVersion = matcher.group(1)
            }
        }

        if (ecVersion == null) {
            throw new GradleException("Couldn't find version number")
        }

        def BUILD_NUM = 3 // Distinguish multiple releases with the same version number.
        versionName "$ecVersion-$BUILD_NUM"

        def verParsed = ecVersion.split(/\./).collect { Integer.parseInt(it) }
        versionCode(
            (verParsed[0] * 1000000) +
            (verParsed[1] * 10000) +
            (verParsed[2] * 100) +
            BUILD_NUM
        )

        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    dataBinding.enabled = true

    sourceSets {
        main {
            python {
                srcDir REPO_ROOT

                include "electroncash/"
                exclude "**/*.po", "**/*.pot"  // The .mo files are used at runtime.

                include "electroncash_gui/__init__.py"
                include "electroncash_plugins/__init__.py"
                include "electroncash_plugins/fusion/"

                // From src/main/python
                include "chaquopy/"
                include "electroncash_gui/android/"
            }

            res {
                srcDir STRINGS_DIR  // Generated by generateStrings below.
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "version"

    productFlavors {
        MainNet {
            buildConfigField "boolean", "chipnet", "false"
        }

        ChipNet {
            buildConfigField "boolean", "chipnet", "true"
        }
    }

    lintOptions {
        disable "MissingTranslation"
    }

    def keystore = file("../keystore.jks")

    if (keystore.exists()) {
        signingConfigs {
            config {
                storeFile keystore
                keyAlias "key0"
                keyPassword "android"
                storePassword "android"
            }
        }

        buildTypes.all {
            it.signingConfig signingConfigs.config
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "electroncash-${variant.versionName}.apk"
        }
    }

    buildFeatures {
        viewBinding true
    }
}


chaquopy {
    defaultConfig {
        version = "3.13"

        if (BUILD_PYTHON) {
            buildPython(BUILD_PYTHON)
        }

        pip {
            options("--find-links", "$projectDir/../wheels")

            install("-r", REQUIREMENTS_TXT)
            install("-r", REQUIREMENTS_ANDROID_TXT)
        }

        pyc {
            src = true
            pip = true
        }
    }
}


afterEvaluate {
    // See "Strings" section in README.md.
    task("generateStrings", type: Exec) {
        def scriptFilename = "generate_strings.py"

        inputs.file scriptFilename
        inputs.file "src/main/python/electroncash_gui/android/strings.py"

        outputs.upToDateWhen {
            file(STRINGS_DIR).exists()
        }

        doFirst {
            delete(STRINGS_DIR)
        }

        def pyVersion = "3"

        if (BUILD_PYTHON) {
            executable BUILD_PYTHON
        } else if (System.getProperty("os.name").startsWith("Windows")) {
            executable "py"
            args "-$pyVersion"
        } else {
            executable "python$pyVersion"
        }

        args scriptFilename
        args "--out", STRINGS_DIR
        args "--ignore-unknown-keywords", "tor_binary_name_capitalized"  // See #1989.
    }

    for (variant in android.applicationVariants) {
        tasks.getByName("generate${variant.name.capitalize()}Resources")
            .dependsOn("generateStrings")
    }


    task("deleteStrings") {
        doLast {
            delete(STRINGS_DIR)
        }
    }


    task("regenerateStrings") {
        dependsOn("deleteStrings", "generateStrings")
    }


    // Remove unnecessary or duplicate requirements.
    task("generateRequirementsTxt") {
        inputs.file "$REPO_ROOT/contrib/deterministic-build/requirements.txt"
        outputs.file REQUIREMENTS_TXT

        doLast {
            def buffer = new StringBuilder()
            def androidWheelHashes = [
                "pyaes==1.6.1": "ba42bdd8754a23b5f60b7c931c51fb9380c7268d011ae6ac8f263c0d2e7ae1b7",
                "qrcode==7.3.1": "7d582bb0421223f4181ad715ca09ac1127e0b882e674239c254e9c2c7a51077d",
                "stem==1.8.0": "d9fec317c237d29715b126b733f9caabcef04e41a97ab9afc8c96511034cb8a0"
            ]

            file(REQUIREMENTS_TXT).withPrintWriter { output ->
                file(inputs.files.singleFile).eachLine { line ->
                    buffer.append(line + "\n")

                    if (!line.endsWith("\\")) {   
                        if (!(buffer =~ /^(cffi|pip|QDarkStyle|setuptools|wheel)==/)) {
                            def requirement = buffer.toString().stripTrailing()
                            androidWheelHashes.each { packageName, hash ->
                                if (requirement.startsWith(packageName + " ")) {
                                    requirement += " \\\n    --hash=sha256:${hash}"
                                }
                            }
                            output.println(requirement)
                        }

                        buffer.setLength(0)
                    }
                }
            }
        }
    }    
    
    // Add hashes for locally built Python 3.13 Android Coincurve wheels without
    // modifying the shared, deterministic-build requirements file.
    task("generateAndroidRequirementsTxt") {
        inputs.file "$REPO_ROOT/contrib/deterministic-build/requirements-android.txt"
        outputs.file REQUIREMENTS_ANDROID_TXT

        doLast {
            def buffer = new StringBuilder()
            file(REQUIREMENTS_ANDROID_TXT).withPrintWriter { output ->
                file(inputs.files.singleFile).eachLine { line ->
                    buffer.append(line + "\n")
                    if (!line.endsWith("\\")) {
                        def requirement = buffer.toString().stripTrailing()
                        if (requirement.startsWith("coincurve==13.0.0 ")) {
                            requirement += " \\\n    --hash=sha256:b836e2d74debe9790439d4208719f6b871ba3ea007740016d3c750d9c1c3d194"
                            requirement += " \\\n    --hash=sha256:dc34b28038771f0f1a9387ad237a94081e2544e50f3da422fc0460425240529b"
                        }
                        output.println(requirement)
                        buffer.setLength(0)
                    }
                }
            }
        }
    }

    // Generate Electron Cash's requirements file before Chaquopy installs dependencies.
    tasks.configureEach { task ->
    if (task.name.endsWith("PythonRequirements")) {
        task.dependsOn("generateRequirementsTxt", "generateAndroidRequirementsTxt")
        }
    }
}




dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlinVersion"

    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.fragment:fragment-ktx:1.2.0'
    implementation 'androidx.preference:preference:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.1.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.1.0'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1'

    // As recommended in zxing-android-embedded documentation, reduce
    // zxing:core version number, otherwise we require API level 19.
    implementation('com.journeyapps:zxing-android-embedded:3.6.0') {
        transitive = false
    }

    implementation 'com.google.zxing:core:3.3.0'

    def acraVersion = "5.2.0"

    implementation "ch.acra:acra-core:$acraVersion"
    implementation "ch.acra:acra-dialog:$acraVersion"
    implementation "ch.acra:acra-http:$acraVersion"

    // OLD TEST CODE
    // testImplementation 'junit:junit:4.12'
    // androidTestImplementation 'androidx.test:runner:1.1.0'
    // androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.0'

    // NEW TEST CODE
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    androidTestImplementation 'androidx.test:runner:1.4.0'
    androidTestImplementation 'androidx.test:rules:1.4.0'
    androidTestImplementation 'androidx.test:core:1.4.0'
}
